[workspace]
resolver = "3"
members = ["phanerite-app", "phanerite-core"]

[workspace.package]
authors = ["Enita <enitanureya@outlook.com>", "Tuxium <ursusfeline07@gmail.com>"]
repository = "https://github.com/feniota/phanerite"
homepage = "https://phenocryst.ferris.love/phanerite/"
description = "A preconfigure-able Minecraft launcher, which connects to and is managed by an Aphanite server."
readme = "README.md"
keywords = ["minecraft", "launcher"]
categories = ["games"]
edition = "2024"

[workspace.dependencies]
bytes = "1.12"
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
async-fs = "2.2"
futures = "0.3"
http = "1.5"
image = { version = "0.25", default-features = false }
serde = { version = "1.0", features = ["derive"] }
strum = { version = "0.28", features = ["derive"] }
tracing = "0.1.44"
url = { version = "2.5", features = ["serde"] }
uuid = { version = "1.24", features = ["serde", "v7"] }
zstd = "0.13.3"

[profile.dev.package]
gpui-pre = { opt-level = 3 }
gpui-component = { opt-level = 3 }
gpui-kit = { opt-level = 3 }
gpui-kit-assets = { opt-level = 3 }
gpui-pre-macros = { opt-level = 3 }
gpui-pre-platform = { opt-level = 3 }
rustybuzz = { opt-level = 3 }
taffy = { opt-level = 3 }
ttf-parser = { opt-level = 3 }
