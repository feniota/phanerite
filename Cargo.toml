[workspace]
resolver = "3"
members = ["phanerite-core", "phanerite-ui/executor", "phanerite-ui/layout", "phanerite-ui/macros", "phanerite-ui/resources"]

[workspace.package]
authors = ["Enita <enitanureya@outlook.com>", "Tuxium <ursusfeline07@gmail.com>"]
repository = "https://github.com/feniota/phanerite"
homepage = "https://phenocryst.ferris.love/phanerite/"
description = "A preconfigure-able Minecraft launcher, which connects to and is managed by an Aphanite server."
readme = "README.md"
keywords = ["minecraft", "launcher"]
categories = ["games"]
edition = "2024"

[workspace.dependencies]

# Async
async-channel = "2.5"
async-executor = "1.14"
async-fs = "2.2"
async-lock = "3.4"
async-process = "2.5"
async-task = "4.7"
event-listener = "5.4"
futures = "0.3"
futures-lite = "2.6"

# Data Structures
bytes = "1.12"
chrono = { version = "0.4", features = ["serde"] }
http = "1.5"
image = { version = "0.25", default-features = false }
serde = { version = "1.0", features = ["derive"] }
strum = { version = "0.28", features = ["derive"] }
url = { version = "2.5", features = ["serde"] }
uuid = { version = "1.24", features = ["serde", "v7"] }

# GPU
wgpu = "30.0"

# Utils
dotenvy = "0.15"

# Logging / Debug
thiserror = "2.0"
tracing = "0.1.44"

[profile.dev.package]
gpui-pre = { opt-level = 3 }
gpui-component = { opt-level = 3 }
gpui-kit = { opt-level = 3 }
gpui-kit-assets = { opt-level = 3 }
gpui-pre-macros = { opt-level = 3 }
gpui-pre-platform = { opt-level = 3 }
rustybuzz = { opt-level = 3 }
taffy = { opt-level = 3 }
ttf-parser = { opt-level = 3 }
