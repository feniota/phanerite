[package]
name = "phanerite"
version = "0.1.0"
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
edition.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "phanerite"
path = "src/main.rs"

[[bin]]
name = "gallery"
path = "src/bin/gallery.rs"
required-features = ["gallery"]

[features]
default = ["seed"]
seed = []
gallery = ["seed"]

[dependencies]
phanerite-core = { path = "../phanerite-core" }
# zed-industries/zed?rev=08827f9 (pinned by gpui-component)
gpui = { git = "https://github.com/zed-industries/zed", features = ["wayland", "x11"] }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = [
  "font-kit",
  "wayland",
  "x11",
] }
gpui-component = { git = "https://github.com/longbridge/gpui-component", rev = "56f3d903eaef3b2504cf31518ed1ad69d80166ff" }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component", rev = "56f3d903eaef3b2504cf31518ed1ad69d80166ff" }
anyhow = "1.0"
rust-embed = "8.12.0"

[dev-dependencies]
gpui = { git = "https://github.com/zed-industries/zed", features = ["test-support"] }
