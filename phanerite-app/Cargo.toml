[package]
name = "phanerite"
version = "0.1.0"
build = "build.rs"
license = "GPL-3.0-or-later"
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
edition.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "phanerite"
path = "src/main.rs"

[[example]]
name = "gallery"
path = "examples/gallery.rs"
required-features = ["gallery"]

[features]
default = ["seed"]
seed = []
gallery = ["seed"]

[dependencies]
phanerite-core = { path = "../phanerite-core", features = ["moka"] }
gpui-kit = { git = "https://github.com/longbridge/gpui-kit", tag = "v0.6.0" }

anyhow = "1.0"
async-trait = "0.1.92"
chrono.workspace = true
dotenvy.workspace = true
rust-embed = "8.12.0"
smallvec = "1.15.2"
zstd.workspace = true
dirs = "6.0.0"
turso = { git = "https://github.com/tursodatabase/turso", rev = "046e9cbf67d22491e8ecc941ec2891b02a9f3cad" }
turso_core = { git = "https://github.com/tursodatabase/turso", rev = "046e9cbf67d22491e8ecc941ec2891b02a9f3cad", features = ["fs", "io_uring", "experimental_win_iocp"] }
tracing.workspace = true
concurrent-queue = "2.5.0"
async-fs.workspace = true

[dev-dependencies]
gpui-kit = { git = "https://github.com/longbridge/gpui-kit", tag = "v0.6.0", features = ["test-support"] }
tempfile = "3"
