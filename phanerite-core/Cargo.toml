[package]
name = "phanerite-core"
version = "0.1.0"
edition = "2024"

[dependencies]
async-channel = "2.5"
async-fs = "2.2"
async-process = "2.5"
base64 = "0.23"
blake3 = { version = "1.8", features = ["serde"] }
bzip2 = "0.6"
chrono = { version = "0.4", features = ["serde"] }
event-listener = "5.4"
flate2 = "1.1"
futures = "0.3"
hex = "0.4"
http = "1.4"
isahc = { version = "2.0", default-features = false, features = ["http2", "rustls-tls", "static-curl"] }
secrecy = { version = "0.10", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.11"
sha2 = "0.11"
strum = { version = "0.28", features = ["derive"] }
tar = "0.4"
tracing = "0.1"
url = { version = "2.5", features = ["serde"] }
uuid = { version = "1.24", features = ["serde", "v7"] }
xz2 = "0.1"
zip = "8.6"
zstd = { version = "0.13", default-features = false }

[dev-dependencies]
dotenvy = "0.15"
smol = "2.0"
tracing-subscriber = "0.3"
