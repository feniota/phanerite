[package]
name = "phanerite-core"
version = "0.1.1"
license = "MIT OR Apache-2.0"
description = "A Minecraft launcher core library written in Rust"

authors.workspace = true
repository.workspace = true
homepage.workspace = true
edition.workspace = true
readme = "README.md"
keywords.workspace = true
categories = ["development-tools"]

[dependencies]

# async runtime / async utilities
async-channel.workspace = true
async-fs.workspace = true
async-lock.workspace = true
async-process.workspace = true
event-listener.workspace = true
futures.workspace = true

# serialization / data format
serde.workspace = true
serde_json = "1.0"
serde-xml-rs = "0.8"
strum.workspace = true

# networking / http
http.workspace = true
trillium-cache = { version = "0.2", features = ["client", "smol"] }
trillium-client = "0.9"
trillium-client-retry = "0.1"
trillium-compression = { version = "0.3", features = ["client"] }
trillium-quinn = { version = "0.1", features = ["webpki-roots"] }
trillium-redirect = { version = "0.3", features = ["client"] }
trillium-rustls = "0.11"
trillium-smol = "0.7"
url.workspace = true

# cryptography / encoding
base64 = "0.23"
blake3 = { version = "1.8", features = ["serde"] }
hex = "0.4"
md5 = "0.8"
secrecy = { version = "0.10", features = ["serde"] }
sha1 = "0.11"
sha2 = "0.11"

# archive / compression
bzip2 = "0.6"
flate2 = "1.1"
tar = "0.4"
xz2 = "0.1"
zip = "9.1"
zstd = { version = "0.14", default-features = false }

# database / data structures
bytes.workspace = true
moka = { version = "0.12", features = ["future"], optional = true }
ouroboros = "0.18"
scc = "3.8"

# time / identifiers
chrono.workspace = true
uuid.workspace = true

# logging / diagnostics
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
async-executor = "1.14"
pollster = "1.0.1"
dotenvy = "0.15"
smol = "2.0"
tracing-subscriber = "0.3"
