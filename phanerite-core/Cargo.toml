[package]
name = "phanerite-core"
version = "0.1.0"
edition = "2024"

[features]
tokio = ["dep:tokio"]
compio = ["dep:compio"]
reqwest = ["dep:reqwest", "tokio"]
nyquest = ["dep:nyquest"]
ureq = ["dep:ureq"]

[dependencies]
blake3 = { version = "1.8", features = ["serde"] }
chrono = { version = "0.4.45", features = ["serde"] }
compio = { version = "0.19", features = ["io", "fs"], optional = true }
hex = "0.4"
http = "1"
nyquest = { version = "0.4", features = ["async"], optional = true }
reqwest = { version = "0.13", default-features = false, features = ["rustls"], optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.11"
tokio = { version = "1.53", features = ["fs", "io-util", "sync"], optional = true }
ureq = { version = "3", features = ["_tls"], optional = true }
uuid = { version = "1.24", features = ["v7"] }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
