[package]
name = "phanerite-core"
version = "0.1.0"
edition = "2024"

[dependencies]
async-channel = "2.5"
async-fs = "2.2"
async-lock = "3.4"
async-process = "2.5"
blake3 = { version = "1.8", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }
event-listener = "5.4"
futures = "0.3"
hex = "0.4"
isahc = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.11"
strum = { version = "0.28", features = ["derive"] }
tar = "0.4"
tracing = "0.1"
uuid = { version = "1.24", features = ["v7"] }
zip = "8.6"

[dev-dependencies]
indicatif = "0.18"
smol = "2.0"
tracing-subscriber = "0.3"
