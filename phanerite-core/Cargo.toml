[package]
name = "phanerite-core"
version = "0.1.0"
edition = "2024"

[features]
tokio = ["dep:tokio"]
compio = ["dep:compio"]
reqwest = ["dep:reqwest", "tokio"]
nyquest = ["dep:nyquest"]

[dependencies]
tokio = { version = "1.0", features = ["fs", "io-util", "sync"], optional = true }
compio = { version = "0.19", features = ["io", "fs"], optional = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"], optional = true }
nyquest = { version = "0.4", features = ["async"], optional = true }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
time = { version = "0.3.53", features = ["serde"] }
sha1 = "0.11.0"
hex = "0.4.3"
blake3 = { version = "1.8.5", features = ["serde"] }
uuid = { version = "1.24.0", features = ["v7"] }
