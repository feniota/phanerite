[package]
name = "phanerite-core"
version = "0.1.0"
edition = "2024"

[dependencies]
async-fs = "2.2"
blake3 = { version = "1.8", features = ["serde"] }
chrono = { version = "0.4.45", features = ["serde"] }
crypto-common = "0.2"
event-listener = "5.4.1"
futures = "0.3"
hex = "0.4"
nyquest = { version = "0.4.0", features = ["async", "async-stream", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.11"
tracing = "0.1"
uuid = { version = "1.24", features = ["v7"] }

