[package]
name = "phanerite-core"
version = "0.1.0"
edition = "2024"

[features]
tokio = ["dep:tokio"]
compio = ["dep:compio"]
reqwest = ["dep:reqwest", "tokio"]
nyquest = ["dep:nyquest", "dep:nyquest-preset", "dep:nyquest-backend-curl"]
ureq = ["dep:ureq", "dep:http"]

[dependencies]
blake3 = { version = "1.8", features = ["serde"] }
chrono = { version = "0.4.45", features = ["serde"] }
compio = { version = "0.19", features = ["io", "fs"], optional = true }
futures = "0.3.32"
hex = "0.4"
http = { version = "1.4", optional = true }
nyquest = { version = "0.4", features = ["async"], optional = true }
nyquest-preset = { version = "0.4", optional = true }
nyquest-backend-curl = { version = "0.4", features = ["async"], optional = true }
reqwest = { version = "0.13", default-features = false, features = ["rustls"], optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.11"
tokio = { version = "1", features = ["fs", "io-util", "sync", "macros", "rt-multi-thread"], optional = true }
tracing = "0.1"
ureq = { version = "3.3", features = ["rustls"], optional = true }
uuid = { version = "1.24", features = ["v7"] }

[dev-dependencies]
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
