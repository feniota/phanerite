[package]
name = "phanerite-executor"
version = "0.1.0-dev"
license = "MIT OR Apache-2.0"

authors.workspace = true
repository.workspace = true
homepage.workspace = true
edition.workspace = true
categories = ["development-tools"]

[dependencies]
phanerite-ui-macro = { path = "macro" }
phanerite-render = { path = "../render", default-features = false }

# Window / Event
tao = "0.37"
taao = { version = "0.1", features = ["event", "tracing"] }

# GPU / Render
wgpu.workspace = true

# Async / Executor
async-executor.workspace = true
async-channel.workspace = true
futures-lite.workspace = true

# Serialization / Data format
url.workspace = true

# Logging / Debug
thiserror.workspace = true
tracing.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
gdkwayland-sys = "0.18"

[dev-dependencies]
phanerite-layout = { path = "../layout" }
phanerite-render = { path = "../render", default-features = false, features = ["layout-debug"] }
