[package]
name = "phanerite-executor"
version = "0.1.0-dev"
license = "MIT OR Apache-2.0"

authors.workspace = true
repository.workspace = true
homepage.workspace = true
description.workspace = true
edition.workspace = true
keywords.workspace = true
categories = ["development-tools"]

[dependencies]
phanerite-ui-macro = { path = "macro" }

# Window / Event
tao = "0.37"
taao = { version = "0.1", features = ["event", "tracing"] }

# GPU / Render
wgpu = "30.0"

# Async / Executor
async-executor = { version = "1.14", features = ["static"] }
async-channel = "2.5"
futures-lite = "2.6"

# Serialization / Data format
url.workspace = true

# Logging / Debug
thiserror = "2.0"
tracing.workspace = true
