[package]
name = "phanerite-render"
version = "0.1.0-dev"
license = "MIT OR Apache-2.0"

authors.workspace = true
repository.workspace = true
homepage.workspace = true
edition.workspace = true
categories = ["development-tools"]

[features]
default = ["layout-debug"]
layout-debug = ["dep:phanerite-layout", "dep:bytemuck", "dep:thiserror"]

[dependencies]
phanerite-layout = { path = "../layout", optional = true }

bytemuck = { version = "1.25", optional = true }
thiserror = { workspace = true, optional = true }
wgpu.workspace = true

[dev-dependencies]
futures-lite.workspace = true

[[test]]
name = "layout_render"
required-features = ["layout-debug"]
