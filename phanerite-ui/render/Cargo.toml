[package]
name = "phanerite-render"
version = "0.1.0-dev"
license = "MIT OR Apache-2.0"

authors.workspace = true
repository.workspace = true
homepage.workspace = true
description.workspace = true
edition.workspace = true
keywords.workspace = true
categories = ["development-tools"]

[features]
default = ["layout-debug"]
layout-debug = ["dep:phanerite-layout", "dep:bytemuck", "dep:thiserror"]

[dependencies]
phanerite-layout = { path = "../layout", optional = true }
wgpu.workspace = true
bytemuck = { version = "1.25", optional = true }
thiserror = { version = "2.0", optional = true }

[dev-dependencies]
futures-lite = "2.6"

[[test]]
name = "layout_render"
required-features = ["layout-debug"]
